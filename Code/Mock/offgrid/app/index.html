<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1614">
<title>Off-the-Grid</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1614; --surface:#16211E; --raised:#1C2A26; --border:#28352F;
    --text:#E8EDEA; --muted:#8A9A93; --faint:#5E6E68;
    --solar:#F2B33D; --green:#5FD08A; --alert:#E8896A;
    --radius:16px; --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(900px 520px at 78% -8%, rgba(242,179,61,.10), transparent 60%),
      radial-gradient(700px 500px at 0% 8%, rgba(95,208,138,.06), transparent 55%),
      var(--bg);
    color:var(--text); font-family:Inter,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; min-height:100dvh;
    padding:max(14px,env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:560px;margin:0 auto}

  /* ---------- topbar ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 2px 18px}
  .brand{display:flex;align-items:center;gap:10px;font-family:Sora,sans-serif;font-weight:700;letter-spacing:-.02em;font-size:17px}
  .mark{width:26px;height:26px;flex:none}
  .pill{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;
    padding:6px 11px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--faint);box-shadow:0 0 0 0 transparent;transition:.3s}
  .pill.ok{color:var(--green)} .pill.ok .dot{background:var(--green);box-shadow:0 0 10px rgba(95,208,138,.7)}
  .pill.off{color:var(--alert)} .pill.off .dot{background:var(--alert)}

  /* ---------- hero / mesures ---------- */
  .hero{background:linear-gradient(180deg,var(--raised),var(--surface));border:1px solid var(--border);
    border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 18px 16px;margin-bottom:14px}
  .hero h2{margin:0 0 2px;font-family:Sora,sans-serif;font-weight:600;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
  .soc{display:flex;align-items:baseline;gap:8px;margin-top:8px}
  .soc .val{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:44px;line-height:1;letter-spacing:-.02em}
  .soc .unit{font-family:'IBM Plex Mono',monospace;font-size:18px;color:var(--muted)}
  .soc .tag{margin-left:auto;font-size:12.5px;color:var(--muted);font-weight:500;align-self:center}
  .bar{height:10px;border-radius:6px;background:#0c1311;border:1px solid var(--border);overflow:hidden;margin-top:12px}
  .bar > i{display:block;height:100%;border-radius:6px 0 0 6px;
    background:linear-gradient(90deg,#3f8f63,var(--green));transition:width .6s cubic-bezier(.2,.7,.2,1)}
  .metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
  .metric{background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:12px;padding:11px 13px}
  .metric .k{font-size:11.5px;color:var(--muted);letter-spacing:.03em}
  .metric .v{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:21px;margin-top:5px}
  .metric .v small{font-size:12px;color:var(--muted);font-weight:500;margin-left:3px}

  /* ---------- groupes de parametres ---------- */
  .group{margin-top:22px}
  .group > .lbl{font-family:Sora,sans-serif;font-size:12px;font-weight:600;letter-spacing:.08em;
    text-transform:uppercase;color:var(--faint);margin:0 4px 9px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:16px 16px 15px;margin-bottom:11px}
  .card .top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .card .name{font-weight:600;font-size:15px}
  .card .cur{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:22px;letter-spacing:-.01em}
  .card .cur small{font-size:13px;color:var(--muted);margin-left:2px}
  .card .cur.pending{color:var(--solar)}

  /* slider + garde-fous */
  .range{margin-top:14px}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:5px;
    background:linear-gradient(90deg,var(--solar) var(--fill,0%), #0c1311 var(--fill,0%));border:1px solid var(--border)}
  input[type=range]::-moz-range-track{height:8px;border-radius:5px;background:#0c1311;border:1px solid var(--border)}
  input[type=range]::-moz-range-progress{height:8px;border-radius:5px;background:var(--solar)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;margin-top:-7px;
    width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--solar);box-shadow:0 2px 6px rgba(0,0,0,.5)}
  input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--solar)}
  input[type=range]:focus-visible{outline:none}
  input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px rgba(242,179,61,.35)}
  .bounds{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;color:var(--faint);margin-top:3px}
  .bounds .safe{color:var(--green);letter-spacing:.02em}

  /* segmented (modes) */
  .seg{display:flex;gap:6px;margin-top:14px;background:#0c1311;border:1px solid var(--border);border-radius:11px;padding:4px}
  .seg button{flex:1;border:0;background:transparent;color:var(--muted);font-family:Inter,sans-serif;
    font-weight:600;font-size:13.5px;padding:9px 0;border-radius:8px;cursor:pointer;transition:.18s}
  .seg button[aria-pressed=true]{background:var(--raised);color:var(--text);box-shadow:0 1px 0 rgba(255,255,255,.05) inset}

  /* toggle */
  .toggle{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
  .switch{position:relative;width:52px;height:30px;flex:none}
  .switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
  .switch .track{position:absolute;inset:0;border-radius:999px;background:#0c1311;border:1px solid var(--border);transition:.22s}
  .switch .knob{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--faint);transition:.22s}
  .switch input:checked + .track{background:rgba(95,208,138,.22);border-color:var(--green)}
  .switch input:checked + .track + .knob{transform:translateX(22px);background:var(--green)}
  .switch input:focus-visible + .track{box-shadow:0 0 0 4px rgba(95,208,138,.3)}

  /* apply + feedback */
  .actions{display:flex;align-items:center;gap:10px;margin-top:13px;min-height:24px}
  .apply{margin-left:auto;border:0;border-radius:10px;background:var(--solar);color:#1a1205;
    font-family:Sora,sans-serif;font-weight:700;font-size:13.5px;padding:10px 16px;cursor:pointer;
    transition:.15s;opacity:0;pointer-events:none;transform:translateY(4px)}
  .apply.show{opacity:1;pointer-events:auto;transform:none}
  .apply:active{transform:scale(.97)}
  .apply[disabled]{opacity:.5;pointer-events:none}
  .note{font-size:12.5px;font-weight:500}
  .note.ok{color:var(--green)} .note.err{color:var(--alert)}

  .foot{margin-top:24px;text-align:center;color:var(--faint);font-size:12px;line-height:1.7}
  .foot a,.foot button{color:var(--muted);background:none;border:0;font-size:12px;text-decoration:underline;cursor:pointer}
  .cfg{display:none;margin-top:10px}
  .cfg input{width:100%;background:#0c1311;border:1px solid var(--border);color:var(--text);
    border-radius:9px;padding:9px 11px;font-family:'IBM Plex Mono',monospace;font-size:12.5px}
  .banner{display:none;background:rgba(232,137,106,.12);border:1px solid rgba(232,137,106,.4);
    color:var(--alert);border-radius:12px;padding:11px 14px;font-size:13px;margin-bottom:14px}
  .banner.show{display:block}
  .skeleton{opacity:.4}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <circle cx="16" cy="16" r="14" stroke="#F2B33D" stroke-width="1.6" opacity=".5"/>
        <path d="M17.5 5 L9 18 h6 l-1.5 9 L23 13 h-6 z" fill="#F2B33D"/>
      </svg>
      Off-the-Grid
    </div>
    <span id="status" class="pill"><span class="dot"></span><span id="statusTxt">Connexion…</span></span>
  </div>

  <div id="vpnBanner" class="banner">
    Gateway injoignable. Vérifie que le tunnel <b>OpenVPN</b> est actif, puis relance.
  </div>

  <section class="hero" id="hero">
    <h2>Autonomie</h2>
    <div class="soc">
      <span class="val" id="socVal">—</span><span class="unit">%</span>
      <span class="tag" id="socTag">batterie</span>
    </div>
    <div class="bar"><i id="socBar" style="width:0%"></i></div>
    <div class="metrics">
      <div class="metric"><div class="k">Production solaire</div><div class="v" id="pv">—<small>W</small></div></div>
      <div class="metric"><div class="k">Température ballon</div><div class="v" id="ballon">—<small>°C</small></div></div>
    </div>
  </section>

  <div id="params"></div>

  <div class="foot">
    Pilotage à distance de l'EMS — site pilote de Montchauvel.<br>
    <button id="cfgBtn">Réglages connexion</button>
    <div class="cfg" id="cfg">
      <input id="cfgUrl" placeholder="URL du gateway (vide = même origine)" autocomplete="off" spellcheck="false">
    </div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
let API = "";                 // meme origine quand servie par le gateway
let dirty = new Set();        // parametres en cours d'edition (ne pas ecraser)
let lastState = null;

// ---- reglages connexion (en memoire, pas de stockage) ----
$("#cfgBtn").onclick = () => { const c=$("#cfg"); c.style.display = c.style.display==="block"?"none":"block"; $("#cfgUrl").focus(); };
$("#cfgUrl").oninput = (e) => { API = e.target.value.replace(/\/+$/,""); refresh(); };

function setStatus(ok){
  const p=$("#status"), t=$("#statusTxt");
  p.className = "pill " + (ok?"ok":"off");
  t.textContent = ok ? "Connecté" : "Hors ligne";
  $("#vpnBanner").classList.toggle("show", !ok);
}

async function refresh(){
  try{
    const r = await fetch(API + "/api/state", {cache:"no-store"});
    if(!r.ok) throw new Error("state");
    const s = await r.json();
    lastState = s; setStatus(true); render(s);
  }catch(e){ setStatus(false); }
}

function render(s){
  // hero
  const soc = s.readonly.find(p=>p.id==="socBatterie");
  const pv  = s.readonly.find(p=>p.id==="puissancePV");
  const bal = s.readonly.find(p=>p.id==="tempBallon");
  if(soc){ $("#socVal").textContent = Math.round(soc.value); $("#socBar").style.width = Math.max(0,Math.min(100,soc.value))+"%";
           $("#socTag").textContent = soc.value>50?"batterie — confortable":soc.value>30?"batterie — surveiller":"batterie — basse"; }
  if(pv)  $("#pv").innerHTML = Math.round(pv.value)+'<small>W</small>';
  if(bal) $("#ballon").innerHTML = bal.value.toFixed(1)+'<small>°C</small>';

  // parametres groupes (rendu une seule fois, puis maj des valeurs)
  if(!$("#params").dataset.built){ buildParams(s.writable); $("#params").dataset.built="1"; }
  for(const p of s.writable){ if(!dirty.has(p.id)) syncControl(p); }
}

function buildParams(writable){
  const groups = {};
  for(const p of writable){ (groups[p.group]=groups[p.group]||[]).push(p); }
  const root = $("#params"); root.innerHTML="";
  for(const [g, items] of Object.entries(groups)){
    const sec = document.createElement("div"); sec.className="group";
    sec.innerHTML = `<p class="lbl">${g}</p>`;
    for(const p of items) sec.appendChild(card(p));
    root.appendChild(sec);
  }
}

function card(p){
  const el = document.createElement("div"); el.className="card"; el.id="card-"+p.id;
  if(p.kind==="number"){
    el.innerHTML = `
      <div class="top"><span class="name">${p.label}</span>
        <span class="cur" id="cur-${p.id}">—<small>${p.unit}</small></span></div>
      <div class="range">
        <input type="range" id="rg-${p.id}" min="${p.min}" max="${p.max}" step="${p.step}" aria-label="${p.label}">
        <div class="bounds"><span>${p.min} ${p.unit}</span><span class="safe">plage sûre</span><span>${p.max} ${p.unit}</span></div>
      </div>
      <div class="actions"><span class="note" id="note-${p.id}"></span>
        <button class="apply" id="ap-${p.id}">Appliquer</button></div>`;
    setTimeout(()=>{
      const rg=$("#rg-"+p.id), cur=$("#cur-"+p.id), ap=$("#ap-"+p.id);
      rg.oninput = () => { dirty.add(p.id);
        cur.innerHTML = rg.value+`<small>${p.unit}</small>`; cur.classList.add("pending");
        rg.style.setProperty("--fill", ((rg.value-p.min)/(p.max-p.min)*100)+"%");
        ap.classList.add("show"); $("#note-"+p.id).textContent=""; };
      ap.onclick = () => write(p, Number(rg.value), ap);
    });
  } else if(p.kind==="enum"){
    el.innerHTML = `<div class="top"><span class="name">${p.label}</span></div>
      <div class="seg" id="seg-${p.id}">` +
      p.options.map(o=>`<button data-v="${o.value}">${o.label}</button>`).join("") +
      `</div><div class="actions"><span class="note" id="note-${p.id}"></span></div>`;
    setTimeout(()=> $("#seg-"+p.id).querySelectorAll("button").forEach(b=>{
      b.onclick=()=> write(p, Number(b.dataset.v), null); }));
  } else { // boolean
    el.innerHTML = `<div class="toggle"><span class="name">${p.label}</span>
        <label class="switch"><input type="checkbox" id="sw-${p.id}" aria-label="${p.label}">
          <span class="track"></span><span class="knob"></span></label></div>
      <div class="actions"><span class="note" id="note-${p.id}"></span></div>`;
    setTimeout(()=> $("#sw-"+p.id).onchange=(e)=> write(p, e.target.checked, null));
  }
  return el;
}

function syncControl(p){
  if(p.kind==="number"){
    const rg=$("#rg-"+p.id), cur=$("#cur-"+p.id);
    if(rg){ rg.value=p.value; rg.style.setProperty("--fill", ((p.value-p.min)/(p.max-p.min)*100)+"%"); }
    if(cur){ cur.innerHTML=p.value+`<small>${p.unit}</small>`; cur.classList.remove("pending"); }
  } else if(p.kind==="enum"){
    $("#seg-"+p.id)?.querySelectorAll("button").forEach(b=>
      b.setAttribute("aria-pressed", Number(b.dataset.v)===p.value));
  } else {
    const sw=$("#sw-"+p.id); if(sw) sw.checked = !!p.value;
  }
}

async function write(p, value, ap){
  const note=$("#note-"+p.id); if(ap){ ap.disabled=true; }
  note.textContent="Envoi…"; note.className="note";
  try{
    const r = await fetch(API+"/api/parameters/"+p.id, {
      method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify({value})});
    const d = await r.json();
    if(!r.ok) throw new Error(d.error||"Échec");
    dirty.delete(p.id);
    note.textContent="✓ Appliqué"; note.className="note ok";
    if(ap){ ap.classList.remove("show"); ap.disabled=false; }
    setTimeout(()=>{ if(note.classList.contains("ok")) note.textContent=""; }, 2200);
    refresh();
  }catch(e){
    note.textContent = e.message; note.className="note err";
    if(ap) ap.disabled=false;
    refresh(); // remet l'etat reel du PLC
  }
}

refresh();
setInterval(refresh, 4000);
</script>
</body>
</html>
